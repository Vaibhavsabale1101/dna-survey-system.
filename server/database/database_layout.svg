<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 850" width="100%" height="100%" style="background:#0b1120; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <defs>
    <!-- Card glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="grad-villages" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="grad-records" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-screenings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="grad-catalog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="grad-stops" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="grad-images" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#facc15"/>
    </marker>
    <marker id="arrow-rose" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#fb7185"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 6 4 L 0 7 z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="650" y="45" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="700" letter-spacing="1">DNA SURVEY SYSTEM — MYSQL ENTITY RELATIONSHIP (ER) DIAGRAM</text>
  <text x="650" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Sant Gadge Baba Unnat Gram Yojana · Smart Village Project (TAI Government Polytechnic Kolhapur)</text>

  <!-- ================= RELATIONSHIP CONNECTOR LINES ================= -->
  <!-- villages (380, 200) -> survey_records (470, 200) -->
  <path d="M 390 200 L 470 200" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 2" marker-end="url(#arrow-cyan)"/>
  <rect x="405" y="185" width="50" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="430" y="198" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="700">1 : N</text>

  <!-- survey_records (820, 200) -> tai_screenings (910, 200) -->
  <path d="M 820 200 L 910 200" fill="none" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="845" y="185" width="50" height="18" rx="4" fill="#0f172a" stroke="#2dd4bf" stroke-width="1"/>
  <text x="870" y="198" text-anchor="middle" fill="#2dd4bf" font-size="10" font-weight="700">1 : N</text>

  <!-- problem_catalog (910, 600) -> tai_screenings (1075, 415) -->
  <path d="M 1075 510 L 1075 425" fill="none" stroke="#facc15" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <rect x="1050" y="460" width="50" height="18" rx="4" fill="#0f172a" stroke="#facc15" stroke-width="1"/>
  <text x="1075" y="473" text-anchor="middle" fill="#facc15" font-size="10" font-weight="700">1 : N</text>

  <!-- survey_records (645, 430) -> form_e_stops (645, 510) -->
  <path d="M 645 430 L 645 500" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="620" y="455" width="50" height="18" rx="4" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="645" y="468" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="700">1 : 16</text>

  <!-- form_e_stops (470, 650) -> survey_images (390, 650) -->
  <path d="M 470 650 L 390 650" fill="none" stroke="#fb7185" stroke-width="2.5" marker-end="url(#arrow-rose)"/>
  <rect x="405" y="635" width="50" height="18" rx="4" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
  <text x="430" y="648" text-anchor="middle" fill="#fb7185" font-size="10" font-weight="700">1 : N</text>

  <!-- ================= 1. TABLE: villages ================= -->
  <g transform="translate(60, 110)" filter="url(#glow)">
    <rect width="330" height="270" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="330" height="42" rx="8" fill="url(#grad-villages)"/>
    <rect y="34" width="330" height="8" fill="#0284c7"/>
    <text x="15" y="27" fill="#ffffff" font-size="15" font-weight="700">villages</text>
    <text x="315" y="26" text-anchor="end" fill="#bae6fd" font-size="11">Master · 21 Records</text>

    <!-- Columns -->
    <g font-size="12" fill="#cbd5e1" transform="translate(15, 65)">
      <!-- PK -->
      <rect x="0" y="-12" width="26" height="16" rx="3" fill="#0284c7"/>
      <text x="13" y="0" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">PK</text>
      <text x="35" y="0" font-weight="600" fill="#f8fafc">village_code</text>
      <text x="290" y="0" text-anchor="end" fill="#38bdf8">VARCHAR(10)</text>

      <!-- Row -->
      <text x="35" y="28">village_name (Marathi)</text>
      <text x="290" y="28" text-anchor="end" fill="#94a3b8">VARCHAR(100)</text>

      <text x="35" y="56">taluka</text>
      <text x="290" y="56" text-anchor="end" fill="#94a3b8">VARCHAR(50)</text>

      <text x="35" y="84">district</text>
      <text x="290" y="84" text-anchor="end" fill="#94a3b8">VARCHAR(50)</text>

      <text x="35" y="112">state</text>
      <text x="290" y="112" text-anchor="end" fill="#94a3b8">VARCHAR(50)</text>

      <text x="35" y="140">created_at</text>
      <text x="290" y="140" text-anchor="end" fill="#94a3b8">TIMESTAMP</text>

      <line x1="0" y1="160" x2="295" y2="160" stroke="#334155" stroke-width="1"/>
      <text x="0" y="180" fill="#94a3b8" font-size="11" font-style="italic">e.g. 'VG1' · 'मांगवली', Vaibhavwadi</text>
    </g>
  </g>

  <!-- ================= 2. TABLE: survey_records ================= -->
  <g transform="translate(470, 110)" filter="url(#glow)">
    <rect width="350" height="320" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="350" height="42" rx="8" fill="url(#grad-records)"/>
    <rect y="34" width="350" height="8" fill="#2563eb"/>
    <text x="15" y="27" fill="#ffffff" font-size="15" font-weight="700">survey_records</text>
    <text x="335" y="26" text-anchor="end" fill="#bfdbfe" font-size="11">Forms 0, A, B, C, D, E, F</text>

    <!-- Columns -->
    <g font-size="12" fill="#cbd5e1" transform="translate(15, 65)">
      <!-- PK -->
      <rect x="0" y="-12" width="26" height="16" rx="3" fill="#2563eb"/>
      <text x="13" y="0" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">PK</text>
      <text x="35" y="0" font-weight="600" fill="#f8fafc">id</text>
      <text x="310" y="0" text-anchor="end" fill="#60a5fa">VARCHAR(64)</text>

      <!-- Row -->
      <text x="35" y="26">form_key</text>
      <text x="310" y="26" text-anchor="end" fill="#94a3b8">ENUM(0,A,B,C,D,E,F)</text>

      <!-- FK -->
      <rect x="0" y="38" width="26" height="16" rx="3" fill="#0284c7"/>
      <text x="13" y="50" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">FK</text>
      <text x="35" y="50" font-weight="600" fill="#38bdf8">village_code</text>
      <text x="310" y="50" text-anchor="end" fill="#38bdf8">VARCHAR(10)</text>

      <text x="35" y="76">village_name</text>
      <text x="310" y="76" text-anchor="end" fill="#94a3b8">VARCHAR(100)</text>

      <text x="35" y="102">interviewer</text>
      <text x="310" y="102" text-anchor="end" fill="#94a3b8">VARCHAR(100)</text>

      <text x="35" y="128">survey_date</text>
      <text x="310" y="128" text-anchor="end" fill="#94a3b8">DATE</text>

      <text x="35" y="154" font-weight="600" fill="#facc15">data_json</text>
      <text x="310" y="154" text-anchor="end" fill="#facc15">JSON (Full Form)</text>

      <text x="35" y="180">created_at / updated_at</text>
      <text x="310" y="180" text-anchor="end" fill="#94a3b8">TIMESTAMP</text>

      <line x1="0" y1="198" x2="315" y2="198" stroke="#334155" stroke-width="1"/>
      <text x="0" y="218" fill="#94a3b8" font-size="11" font-style="italic">Indexed on: (village_code, form_key), survey_date</text>
    </g>
  </g>

  <!-- ================= 3. TABLE: tai_screenings ================= -->
  <g transform="translate(910, 110)" filter="url(#glow)">
    <rect width="330" height="305" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="330" height="42" rx="8" fill="url(#grad-screenings)"/>
    <rect y="34" width="330" height="8" fill="#0d9488"/>
    <text x="15" y="27" fill="#ffffff" font-size="15" font-weight="700">tai_screenings</text>
    <text x="315" y="26" text-anchor="end" fill="#99f6e4" font-size="11">Forms A–D Scoring</text>

    <!-- Columns -->
    <g font-size="12" fill="#cbd5e1" transform="translate(15, 65)">
      <!-- PK -->
      <rect x="0" y="-12" width="26" height="16" rx="3" fill="#0d9488"/>
      <text x="13" y="0" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">PK</text>
      <text x="35" y="0" font-weight="600" fill="#f8fafc">id</text>
      <text x="290" y="0" text-anchor="end" fill="#2dd4bf">INT AUTO_INC</text>

      <!-- FK -->
      <rect x="0" y="14" width="26" height="16" rx="3" fill="#2563eb"/>
      <text x="13" y="26" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">FK</text>
      <text x="35" y="26" font-weight="600" fill="#60a5fa">record_id</text>
      <text x="290" y="26" text-anchor="end" fill="#60a5fa">VARCHAR(64)</text>

      <!-- FK -->
      <rect x="0" y="40" width="26" height="16" rx="3" fill="#ca8a04"/>
      <text x="13" y="52" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">FK</text>
      <text x="35" y="52" font-weight="600" fill="#facc15">p_code</text>
      <text x="290" y="52" text-anchor="end" fill="#facc15">VARCHAR(10)</text>

      <text x="35" y="78">long_term (>1 yr)</text>
      <text x="290" y="78" text-anchor="end" fill="#94a3b8">BOOLEAN</text>

      <text x="35" y="104">often (frequent)</text>
      <text x="290" y="104" text-anchor="end" fill="#94a3b8">BOOLEAN</text>

      <text x="35" y="130">many (many households)</text>
      <text x="290" y="130" text-anchor="end" fill="#94a3b8">BOOLEAN</text>

      <text x="35" y="156">real_loss (financial/loss)</text>
      <text x="290" y="156" text-anchor="end" fill="#94a3b8">BOOLEAN</text>

      <text x="35" y="182" font-weight="700" fill="#34d399">keep_drop</text>
      <text x="290" y="182" text-anchor="end" fill="#34d399">ENUM('Keep','Drop')</text>

      <line x1="0" y1="198" x2="295" y2="198" stroke="#334155" stroke-width="1"/>
      <text x="0" y="218" fill="#94a3b8" font-size="11" font-style="italic">Rule: >=2 checked = 'Keep' · &lt;2 = 'Drop'</text>
    </g>
  </g>

  <!-- ================= 4. TABLE: form_e_stops ================= -->
  <g transform="translate(470, 500)" filter="url(#glow)">
    <rect width="350" height="310" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="350" height="42" rx="8" fill="url(#grad-stops)"/>
    <rect y="34" width="350" height="8" fill="#7c3aed"/>
    <text x="15" y="27" fill="#ffffff" font-size="15" font-weight="700">form_e_stops</text>
    <text x="335" y="26" text-anchor="end" fill="#ddd6fe" font-size="11">Village Walk (E1–E16)</text>

    <!-- Columns -->
    <g font-size="12" fill="#cbd5e1" transform="translate(15, 65)">
      <!-- PK -->
      <rect x="0" y="-12" width="26" height="16" rx="3" fill="#7c3aed"/>
      <text x="13" y="0" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">PK</text>
      <text x="35" y="0" font-weight="600" fill="#f8fafc">id</text>
      <text x="310" y="0" text-anchor="end" fill="#c084fc">INT AUTO_INC</text>

      <!-- FK -->
      <rect x="0" y="14" width="26" height="16" rx="3" fill="#2563eb"/>
      <text x="13" y="26" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">FK</text>
      <text x="35" y="26" font-weight="600" fill="#60a5fa">record_id</text>
      <text x="310" y="26" text-anchor="end" fill="#60a5fa">VARCHAR(64)</text>

      <text x="35" y="52" font-weight="600" fill="#f8fafc">stop_id</text>
      <text x="310" y="52" text-anchor="end" fill="#e2e8f0">'E1' to 'E16'</text>

      <text x="35" y="78">place_name</text>
      <text x="310" y="78" text-anchor="end" fill="#94a3b8">VARCHAR(255)</text>

      <text x="35" y="104">actual_seen (Notes)</text>
      <text x="310" y="104" text-anchor="end" fill="#94a3b8">TEXT</text>

      <text x="35" y="130">gps_coordinates</text>
      <text x="310" y="130" text-anchor="end" fill="#94a3b8">VARCHAR(100)</text>

      <text x="35" y="156" font-weight="600" fill="#fb7185">photo_ref</text>
      <text x="310" y="156" text-anchor="end" fill="#fb7185">VARCHAR(255)</text>

      <text x="35" y="182">p_code</text>
      <text x="310" y="182" text-anchor="end" fill="#facc15">VARCHAR(10)</text>

      <line x1="0" y1="198" x2="315" y2="198" stroke="#334155" stroke-width="1"/>
      <text x="0" y="218" fill="#94a3b8" font-size="11" font-style="italic">e.g. E1: Water Well · E9: Waste · E10: Roads</text>
    </g>
  </g>

  <!-- ================= 5. TABLE: survey_images ================= -->
  <g transform="translate(60, 500)" filter="url(#glow)">
    <rect width="330" height="310" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="330" height="42" rx="8" fill="url(#grad-images)"/>
    <rect y="34" width="330" height="8" fill="#e11d48"/>
    <text x="15" y="27" fill="#ffffff" font-size="15" font-weight="700">survey_images</text>
    <text x="315" y="26" text-anchor="end" fill="#fecdd3" font-size="11">Photos &amp; Attachments</text>

    <!-- Columns -->
    <g font-size="12" fill="#cbd5e1" transform="translate(15, 65)">
      <!-- PK -->
      <rect x="0" y="-12" width="26" height="16" rx="3" fill="#e11d48"/>
      <text x="13" y="0" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">PK</text>
      <text x="35" y="0" font-weight="600" fill="#f8fafc">id</text>
      <text x="290" y="0" text-anchor="end" fill="#fb7185">INT AUTO_INC</text>

      <!-- FK -->
      <rect x="0" y="14" width="26" height="16" rx="3" fill="#2563eb"/>
      <text x="13" y="26" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">FK</text>
      <text x="35" y="26" font-weight="600" fill="#60a5fa">record_id</text>
      <text x="290" y="26" text-anchor="end" fill="#60a5fa">VARCHAR(64)</text>

      <text x="35" y="52">stop_id</text>
      <text x="290" y="52" text-anchor="end" fill="#c084fc">'E1'–'E16' (Opt)</text>

      <text x="35" y="78" font-weight="600" fill="#38bdf8">file_path (URL)</text>
      <text x="290" y="78" text-anchor="end" fill="#38bdf8">VARCHAR(500)</text>

      <text x="35" y="104">caption / title</text>
      <text x="290" y="104" text-anchor="end" fill="#94a3b8">VARCHAR(255)</text>

      <text x="35" y="130">mime_type / size</text>
      <text x="290" y="130" text-anchor="end" fill="#94a3b8">image/jpeg, KB</text>

      <text x="35" y="156" font-style="italic" fill="#cbd5e1">image_data (BLOB)</text>
      <text x="290" y="156" text-anchor="end" fill="#fb7185">MEDIUMBLOB (Opt)</text>

      <text x="35" y="182">uploaded_at</text>
      <text x="290" y="182" text-anchor="end" fill="#94a3b8">TIMESTAMP</text>

      <line x1="0" y1="198" x2="295" y2="198" stroke="#334155" stroke-width="1"/>
      <text x="0" y="218" fill="#fb7185" font-size="11" font-weight="600">Supports Path URL or direct BLOB</text>
    </g>
  </g>

  <!-- ================= 6. TABLE: problem_catalog ================= -->
  <g transform="translate(910, 500)" filter="url(#glow)">
    <rect width="330" height="270" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="330" height="42" rx="8" fill="url(#grad-catalog)"/>
    <rect y="34" width="330" height="8" fill="#ca8a04"/>
    <text x="15" y="27" fill="#ffffff" font-size="15" font-weight="700">problem_catalog</text>
    <text x="315" y="26" text-anchor="end" fill="#fef08a" font-size="11">Master · 28 Problems</text>

    <!-- Columns -->
    <g font-size="12" fill="#cbd5e1" transform="translate(15, 65)">
      <!-- PK -->
      <rect x="0" y="-12" width="26" height="16" rx="3" fill="#ca8a04"/>
      <text x="13" y="0" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">PK</text>
      <text x="35" y="0" font-weight="600" fill="#f8fafc">code</text>
      <text x="290" y="0" text-anchor="end" fill="#facc15">VARCHAR(10)</text>

      <text x="35" y="28">problem_en</text>
      <text x="290" y="28" text-anchor="end" fill="#94a3b8">VARCHAR(255)</text>

      <text x="35" y="56">problem_mr (Marathi)</text>
      <text x="290" y="56" text-anchor="end" fill="#94a3b8">VARCHAR(255)</text>

      <text x="35" y="84">category (Sector)</text>
      <text x="290" y="84" text-anchor="end" fill="#94a3b8">VARCHAR(50)</text>

      <text x="35" y="112">created_at</text>
      <text x="290" y="112" text-anchor="end" fill="#94a3b8">TIMESTAMP</text>

      <line x1="0" y1="140" x2="295" y2="140" stroke="#334155" stroke-width="1"/>
      <text x="0" y="165" fill="#94a3b8" font-size="11" font-style="italic">e.g. P01: Water · P06: Pests · P22: Roads</text>
    </g>
  </g>

</svg>
